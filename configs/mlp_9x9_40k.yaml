# Option C: MLP 9x9 baseline with the same data budget as the FlyWire 40k runs.
# Run: CUDA_VISIBLE_DEVICES=0 uv run --no-sync python -m training.supervised \
#        --config configs/mlp_9x9_40k.yaml

model: mlp
side: 9
hidden: [512, 256]
dropout: 0.0

n_train: 40000
n_val: 2000
difficulty: easy
epochs: 40
batch_size: 256
lr: 0.001
weight_decay: 0.0001
seed: 0
device: auto
log_every: 2

eval_solver_seed: 1234
save_state: results/mlp9_40k_state.pt
