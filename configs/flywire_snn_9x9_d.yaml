# Option D: 1k FlyWire ablation — drop dropout, longer train, cosine LR.
# Prior best placement was 1k/drop0.3 (~0.74) with completion ~0.01.
# Run: CUDA_VISIBLE_DEVICES=2 uv run --no-sync python -m training.supervised \
#        --config configs/flywire_snn_9x9_d.yaml

model: flywire_snn
side: 9

n_neurons: 1000
sample_method: top_degree
conn_weight: count

train_recurrent: true
use_signs: false
recurrent_scale: 1.0

T: 10
encoding: constant

n_train: 40000
n_val: 2000
difficulty: easy
epochs: 60
batch_size: 128
lr: 0.001
weight_decay: 0.0001
snn_dropout: 0.0
use_cosine: true
amp: false
seed: 0
device: auto
log_every: 2

eval_solver_seed: 1234
save_state: results/flywire9_d_state.pt
