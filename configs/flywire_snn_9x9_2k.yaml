# FlyWire 9x9 — N=2k + lighter dropout after 5k stalled.
# 1k/dropout0.3: placement ~0.74, UNSEEN completion ~0.01
# 5k/dropout0.3: move_acc stuck ~0.15, UNSEEN completion 0.00 (over-regularized)
# This: middle capacity + snn_dropout 0.3 → 0.1
# Run: CUDA_VISIBLE_DEVICES=2 uv run --no-sync python -m training.supervised \
#        --config configs/flywire_snn_9x9_2k.yaml

model: flywire_snn
side: 9

n_neurons: 2000
sample_method: top_degree
conn_weight: count

train_recurrent: true
use_signs: false
recurrent_scale: 1.0

T: 10
encoding: constant

n_train: 40000
n_val: 2000
difficulty: easy
epochs: 40
batch_size: 128
lr: 0.001
weight_decay: 0.0001
snn_dropout: 0.1
amp: false
seed: 0
device: auto
log_every: 2

eval_solver_seed: 1234
save_state: results/flywire9_2k_state.pt
