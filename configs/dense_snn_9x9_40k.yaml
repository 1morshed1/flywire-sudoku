# Option C: dense SNN 9x9 baseline, matched 40k data budget.
# Run: CUDA_VISIBLE_DEVICES=2 uv run --no-sync python -m training.supervised \
#        --config configs/dense_snn_9x9_40k.yaml

model: dense_snn
side: 9
hidden: [512, 256]
T: 10
encoding: constant

n_train: 40000
n_val: 2000
difficulty: easy
epochs: 40
batch_size: 256
lr: 0.001
weight_decay: 0.0001
amp: true
seed: 0
device: auto
log_every: 2

eval_solver_seed: 1234
save_state: results/dense9_40k_state.pt
